name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Package version selected by Changesets
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check tag and branch
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ inputs.version }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG" || { echo "Tag $TAG does not match package version $version"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            test "$version" = "$VERSION" || { echo "Dispatched version $VERSION does not match package version $version"; exit 1; }
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag commit is not on main"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:oxlint
      - run: bun run typecheck
      - run: bun run knip
      - run: bun test src
      - run: bun run build
      - run: bun test tests/compatibility/bootstrap-runtime.test.ts
      - run: bun run check:exports
      - run: bun run check:package
      - name: Pack the release tarball
        id: pack
        run: |
          mkdir release
          npm pack --silent --pack-destination release
          cd release
          echo "sha256=$(sha256sum ./*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - run: bun run check:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball
          path: release/*.tgz
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
      - name: Publish the validated tarball with provenance
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        run: |
          echo "$EXPECTED_SHA256  klnap-payload-posthog-$VERSION.tgz" | sha256sum --check
          # A re-run after a partial release must not republish or overwrite a version.
          if npm view "@klnap/payload-posthog@$VERSION" version >/dev/null 2>&1; then
            echo "@klnap/payload-posthog@$VERSION is already on npm; skipping publish."
          else
            npm publish "./klnap-payload-posthog-$VERSION.tgz" --provenance --access public
          fi

  github-release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarball
      - name: Create the GitHub release once npm matches the validated tarball
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          tgz="klnap-payload-posthog-$VERSION.tgz"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
          npm_integrity="$(npm view "@klnap/payload-posthog@$VERSION" dist.integrity)"
          test "$local_integrity" = "$npm_integrity" || { echo "npm tarball differs from the validated tarball"; exit 1; }
          tar -xzOf "$tgz" package/CHANGELOG.md | awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / {f=0} f' > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $VERSION"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$tgz" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$tgz" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
          fi
